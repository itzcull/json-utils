packages:
  - playground
  - docs
  - packages/*
  - examples/*
catalogs:
  cli:
    '@antfu/ni': ^28.1.0
    '@itzcull/eslint-config': ^0.0.3
    bumpp: ^10.3.2
    eslint: ^9.39.2
    lint-staged: ^16.2.7
    simple-git-hooks: ^2.13.1
    tsx: ^4.21.0
    typescript: ^5.9.3
    unbuild: ^3.6.1
    vite: npm:@voidzero-dev/vite-plus-core@1.0.0
    vitest: 5.0.1
    vite-plus: 1.0.0
  testing:
    vitest: 5.0.1
    vitest-package-exports: ^1.1.2
    yaml: ^2.8.2
  types:
    '@types/node': ^25.0.3
  utils:
    tinyexec: ^1.0.2
onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
overrides:
  vite@*: catalog:cli
  vitest@*: catalog:cli
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
